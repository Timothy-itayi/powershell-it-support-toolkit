name: PowerShell Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()

          Get-ChildItem ./scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Error $_.Message
              }

              $allErrors += $parseErrors
            }
          }

          if ($allErrors.Count -gt 0) {
            exit 1
          }

      - name: Run account-audit smoke test
        shell: pwsh
        run: |
          $findings = ./scripts/Get-AccountAudit.ps1 `
            -Path ./sample-data/users.csv

          $findings | Format-Table -AutoSize

          if ($findings.Count -lt 3) {
            throw "Expected at least 3 deliberate sample findings."
          }